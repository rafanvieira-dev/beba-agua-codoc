<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Hidratação - CODOC</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícone da aba para evitar erro 404 do favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
</head>
<body>
    <header>
        <h1>💧 H2O Tracker</h1>
        <nav id="menu" class="hidden">
            <button onclick="window.showScreen('dashboard-screen')">Ranking Geral</button>
            <button onclick="window.showScreen('profile-screen')">Meu Perfil</button>
            <button onclick="window.logout()">Sair</button>
        </nav>
    </header>

    <main>
        <!-- Tela de Autenticação / Cadastro -->
        <section id="auth-screen">
            <!-- Botão do Google -->
            <div class="card" id="login-card">
                <h2>Acesse sua conta</h2>
                <button onclick="window.loginComGoogle()" class="google-btn">
                    📧 Entrar com o Google
                </button>
            </div>
            
            <!-- Completar dados (Só aparece na primeira vez) -->
            <div class="card hidden" id="complete-register-card">
                <h2>Completar Cadastro</h2>
                <p id="welcome-name"></p>
                <input type="number" id="age" placeholder="Idade">
                <input type="number" id="weight" placeholder="Peso (kg)">
                <input type="number" id="height" placeholder="Altura (cm)">
                <button onclick="window.salvarDadosGoogle()">Salvar e Começar</button>
            </div>
        </section>

        <!-- Tela do Dashboard (Ranking Público em Tempo Real) -->
        <section id="dashboard-screen" class="hidden">
            <h2>Progresso Diário da Galera</h2>
            <p class="subtitle">Atualizado em tempo real</p>
            <div id="ranking-list" class="ranking-container">
                <!-- Preenchido via JS com dados do Firebase -->
            </div>
        </section>

        <!-- Tela de Perfil Pessoal -->
        <section id="profile-screen" class="hidden">
            <h2>Meu Painel</h2>
            <div class="card profile-card">
                <h3 id="user-greeting">Olá!</h3>
                <p>Sua meta diária: <strong id="user-goal">0</strong> ml</p>
                <p>Você já bebeu: <strong id="user-current">0</strong> ml</p>
                
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progress-text">0%</p>

                <div class="water-actions">
                    <h3>Adicionar Água Agora:</h3>
                    <div class="water-buttons-grid">
                        <button onclick="window.addWater(100)">100 ml</button>
                        <button onclick="window.addWater(150)">150 ml</button>
                        <button onclick="window.addWater(200)">200 ml</button>
                        <button onclick="window.addWater(250)">250 ml</button>
                        <button onclick="window.addWater(300)">300 ml</button>
                        <button onclick="window.addWater(350)">350 ml</button>
                        <button onclick="window.addWater(400)">400 ml</button>
                        <button onclick="window.addWater(450)">450 ml</button>
                        <button onclick="window.addWater(500)">500 ml</button>
                        <button onclick="window.addWater(550)">550 ml</button>
                        <button onclick="window.addWater(600)">600 ml</button>
                        <button onclick="window.addWater(650)">650 ml</button>
                        <button onclick="window.addWater(700)">700 ml</button>
                        <button onclick="window.addWater(750)">750 ml</button>
                        <button onclick="window.addWater(800)">800 ml</button>
                        <button onclick="window.addWater(850)">850 ml</button>
                        <button onclick="window.addWater(900)">900 ml</button>
                        <button onclick="window.addWater(950)">950 ml</button>
                        <button onclick="window.addWater(1000)">1 Litro</button>
                    </div>
                </div>

                <div class="history">
                    <h3>Histórico de Hoje</h3>
                    <ul id="water-history">
                        <!-- Preenchido via JS -->
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
